name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Secrets firewall scan (all tracked files)
        run: bun run scripts/check-secrets.ts --all

      - name: Lint (strict type-checked ESLint)
        run: bun run lint

      - name: Typecheck (strict static analysis)
        run: bun run typecheck

      - name: Test (incl. Zod schema validation)
        run: bun test

      - name: Validate docker compose configuration
        run: docker compose config --quiet
